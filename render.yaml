services:
  - type: web
    name: speakeasy-academy
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false          # set this in the Render dashboard
      - key: OPENAI_BASE_URL
        sync: false          # e.g. https://generativelanguage.googleapis.com/v1beta/openai/
      - key: OPENAI_MODEL
        sync: false          # e.g. gemini-flash-lite-latest
      - key: OPENAI_FALLBACK_MODEL
        sync: false          # e.g. gemini-flash-latest
      - key: ADMIN_PASSWORD
        sync: false          # set this in the Render dashboard
      - key: DATABASE_URL
        sync: false          # Postgres connection string (free: neon.tech). Keeps students, chats and scores across restarts.
      - key: SMTP_HOST
        sync: false          # optional, for enquiry emails (Gmail: smtp.gmail.com)
      - key: SMTP_PORT
        sync: false          # 587
      - key: SMTP_USER
        sync: false          # your Gmail address
      - key: SMTP_PASS
        sync: false          # a Gmail "App password"
      - key: ENQUIRY_TO
        sync: false          # where enquiry emails are sent
